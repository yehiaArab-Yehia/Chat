<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Private Chat</title>

  <script
    type="text/javascript"
    src="https://cdn.scaledrone.com/scaledrone.min.js">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    :root {

      --telegram-blue: #229ed9;
      --telegram-blue-dark: #168ac1;

      --bg: #e7ebee;
      --chat-bg: #dfe7ed;

      --header: #ffffff;
      --footer: #ffffff;

      --mine: #effdde;
      --theirs: #ffffff;

      --text: #17212b;
      --muted: #7b8791;

      --border: #e2e6e9;

      --shadow:
        0 2px 12px rgba(0,0,0,.12);
    }


    /* ==============================
       BODY
    ============================== */

    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      overflow: hidden;
    }


    body {

      background: var(--bg);

      color: var(--text);
    }


    /* ==============================
       التطبيق
    ============================== */

    .app {

      width: 100%;
      height: 100dvh;

      display: flex;

      justify-content: center;
      align-items: center;
    }


    /* ==============================
       نافذة المحادثة
    ============================== */

    .chat {

      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: var(--chat-bg);

      overflow: hidden;
    }


    @media (min-width: 700px) {

      .chat {

        width: min(1100px, 100%);
        height: min(850px, 100dvh);

        border-radius: 12px;

        box-shadow:
          0 10px 40px rgba(0,0,0,.18);

        overflow: hidden;
      }
    }


    /* ==============================
       HEADER
    ============================== */

    .header {

      height: 64px;
      min-height: 64px;

      background: var(--header);

      display: flex;
      align-items: center;

      padding:
        7px 12px;

      border-bottom:
        1px solid var(--border);

      box-shadow:
        0 1px 4px rgba(0,0,0,.08);

      z-index: 10;
    }


    .header-avatar {

      width: 46px;
      height: 46px;

      border-radius: 50%;

      background:
        linear-gradient(
          135deg,
          #2aa7e8,
          #168ac1
        );

      color: white;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 22px;

      margin-left: 10px;

      flex-shrink: 0;
    }


    .header-info {

      flex: 1;

      min-width: 0;
    }


    .header-title {

      font-size: 16px;

      font-weight: 700;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .header-status {

      font-size: 12px;

      color: var(--muted);

      margin-top: 2px;

      transition: .2s;
    }


    .header-status.online {

      color: #28a745;
    }


    /* ==============================
       HEADER BUTTONS
    ============================== */

    .header-actions {

      display: flex;

      align-items: center;

      gap: 4px;
    }


    .header-btn {

      width: 42px;
      height: 42px;

      border: none;

      background: transparent;

      border-radius: 50%;

      font-size: 19px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      transition: .15s;
    }


    .header-btn:hover {

      background: #f0f2f4;
    }


    /* ==============================
       ROOM INFO
    ============================== */

    .room-info {

      position: absolute;

      top: 72px;
      left: 50%;

      transform:
        translateX(-50%)
        translateY(-10px);

      background: white;

      border-radius: 12px;

      padding: 14px;

      width: min(340px, 90%);

      box-shadow:
        0 8px 30px rgba(0,0,0,.2);

      opacity: 0;

      pointer-events: none;

      transition: .2s;

      z-index: 100;
    }


    .room-info.show {

      opacity: 1;

      pointer-events: auto;

      transform:
        translateX(-50%)
        translateY(0);
    }


    .room-info-title {

      font-weight: 700;

      margin-bottom: 10px;
    }


    .room-link {

      background: #f2f4f6;

      border-radius: 8px;

      padding: 10px;

      font-size: 12px;

      direction: ltr;

      word-break: break-all;

      margin-bottom: 10px;
    }


    .copy-room {

      width: 100%;

      border: none;

      background: var(--telegram-blue);

      color: white;

      padding: 10px;

      border-radius: 8px;

      cursor: pointer;

      font-size: 14px;
    }


    /* ==============================
       MESSAGES
    ============================== */

    .messages {

      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding:
        18px 15px 14px;

      display: flex;

      flex-direction: column;

      background-color: var(--chat-bg);

      background-image:
        radial-gradient(
          rgba(90,110,120,.12) 1px,
          transparent 1px
        );

      background-size: 24px 24px;

      scroll-behavior: smooth;
    }


    /* ==============================
       Welcome
    ============================== */

    .welcome {

      width: min(430px, 90%);

      margin: auto;

      text-align: center;

      background:
        rgba(255,255,255,.85);

      padding: 18px;

      border-radius: 14px;

      box-shadow:
        0 2px 8px rgba(0,0,0,.08);

      color: #687782;
    }


    .welcome-icon {

      width: 58px;
      height: 58px;

      margin: 0 auto 10px;

      border-radius: 50%;

      background: var(--telegram-blue);

      color: white;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 27px;
    }


    .welcome-title {

      color: var(--text);

      font-weight: 700;

      margin-bottom: 5px;
    }


    .welcome-text {

      font-size: 13px;

      line-height: 1.5;
    }


    /* ==============================
       MESSAGE
    ============================== */

    .message {

      max-width: min(650px, 78%);

      display: flex;

      flex-direction: column;

      margin-bottom: 7px;

      animation:
        messageIn .15s ease-out;
    }


    @keyframes messageIn {

      from {

        opacity: 0;

        transform:
          translateY(6px);
      }

      to {

        opacity: 1;

        transform:
          translateY(0);
      }
    }


    .message--mine {

      align-self: flex-start;

      align-items: flex-start;
    }


    .message--theirs {

      align-self: flex-end;

      align-items: flex-end;
    }


    .message-name {

      font-size: 11px;

      font-weight: 600;

      color: #687782;

      margin:
        0 8px 3px;
    }


    .message-bubble {

      position: relative;

      padding:
        8px 11px 7px;

      border-radius: 10px;

      box-shadow:
        0 1px 2px rgba(0,0,0,.12);

      word-break: break-word;

      line-height: 1.45;

      font-size: 14.5px;
    }


    .message--mine
    .message-bubble {

      background: var(--mine);

      border-top-left-radius: 3px;
    }


    .message--theirs
    .message-bubble {

      background: var(--theirs);

      border-top-right-radius: 3px;
    }


    .message-meta {

      display: flex;

      justify-content: flex-end;

      align-items: center;

      gap: 4px;

      font-size: 10px;

      color: #78909c;

      margin-top: 3px;
    }


    .message-check {

      color: #229ed9;

      font-size: 13px;
    }


    /* ==============================
       SYSTEM MESSAGE
    ============================== */

    .system-message {

      align-self: center;

      margin:
        8px auto;

      padding:
        6px 12px;

      background:
        rgba(255,255,255,.82);

      color: #65747e;

      border-radius: 10px;

      font-size: 11px;

      box-shadow:
        0 1px 3px rgba(0,0,0,.08);
    }


    /* ==============================
       TYPING
    ============================== */

    .typing {

      min-height: 20px;

      padding:
        0 18px;

      color: var(--telegram-blue);

      font-size: 11px;

      background: var(--chat-bg);
    }


    .typing.hidden {

      visibility: hidden;
    }


    /* ==============================
       FOOTER
    ============================== */

    .footer {

      min-height: 62px;

      padding:
        7px 9px;

      display: flex;

      align-items: center;

      gap: 6px;

      background: var(--footer);

      border-top:
        1px solid var(--border);

      z-index: 10;
    }


    /* ==============================
       Emoji
    ============================== */

    .emoji-btn {

      width: 42px;
      height: 42px;

      border: none;

      border-radius: 50%;

      background: transparent;

      font-size: 22px;

      cursor: pointer;

      flex-shrink: 0;
    }


    .emoji-btn:hover {

      background: #f0f2f4;
    }


    /* ==============================
       Input
    ============================== */

    .input-wrap {

      flex: 1;

      min-width: 0;

      display: flex;

      align-items: center;

      background: #f1f3f5;

      border-radius: 21px;

      padding:
        0 14px;
    }


    input {

      width: 100%;

      height: 42px;

      border: none;

      outline: none;

      background: transparent;

      font-family: inherit;

      font-size: 15px;

      color: var(--text);
    }


    input::placeholder {

      color: #8b98a1;
    }


    /* ==============================
       Send
    ============================== */

    .send-btn {

      width: 45px;
      height: 45px;

      flex-shrink: 0;

      border: none;

      border-radius: 50%;

      background:
        var(--telegram-blue);

      color: white;

      font-size: 18px;

      cursor: pointer;

      display: flex;

      align-items: center;
      justify-content: center;

      transition: .15s;
    }


    .send-btn:hover {

      background:
        var(--telegram-blue-dark);
    }


    .send-btn:active {

      transform:
        scale(.91);
    }


    /* ==============================
       Emoji Picker
    ============================== */

    .emoji-picker {

      position: absolute;

      bottom: 70px;

      right: 10px;

      width: 280px;

      max-height: 220px;

      overflow-y: auto;

      background: white;

      border-radius: 12px;

      padding: 10px;

      box-shadow:
        0 5px 25px rgba(0,0,0,.2);

      display: none;

      grid-template-columns:
        repeat(8, 1fr);

      gap: 4px;

      z-index: 100;
    }


    .emoji-picker.show {

      display: grid;
    }


    .emoji-item {

      border: none;

      background: transparent;

      font-size: 21px;

      padding: 5px;

      border-radius: 6px;

      cursor: pointer;
    }


    .emoji-item:hover {

      background: #eef1f3;
    }


    /* ==============================
       Mobile
    ============================== */

    @media (max-width: 600px) {

      .header {

        height: 60px;
        min-height: 60px;
      }


      .header-avatar {

        width: 42px;
        height: 42px;
      }


      .header-actions {

        gap: 0;
      }


      .messages {

        padding:
          10px 8px;
      }


      .message {

        max-width: 85%;
      }


      .footer {

        padding:
          6px;
      }


      .emoji-picker {

        bottom: 64px;

        right: 6px;

        width: 280px;
      }
    }


    /* ==============================
       Dark mode
    ============================== */

    body.dark {

      --bg: #17212b;

      --chat-bg: #0e1621;

      --header: #17212b;

      --footer: #17212b;

      --mine: #2b5278;

      --theirs: #182533;

      --text: #eeeeee;

      --muted: #9aa8b3;

      --border: #263542;
    }


    body.dark
    .input-wrap {

      background: #202b36;
    }


    body.dark
    .emoji-picker {

      background: #17212b;
    }


    body.dark
    .room-info {

      background: #17212b;
    }


    body.dark
    .room-link {

      background: #202b36;
    }

  </style>

</head>


<body>

<div class="app">

  <main class="chat">


    <!-- ==========================
         HEADER
    =========================== -->

    <header class="header">

      <div class="header-avatar">
        💬
      </div>


      <div class="header-info">

        <div class="header-title">
          محادثة خاصة
        </div>

        <div
          class="header-status"
          id="status">
          في انتظار المستخدم الآخر...
        </div>

      </div>


      <div class="header-actions">

        <button
          class="header-btn"
          id="roomBtn"
          title="معلومات الغرفة">
          🔗
        </button>

        <button
          class="header-btn"
          id="themeBtn"
          title="الوضع الليلي">
          🌙
        </button>

        <button
          class="header-btn"
          id="moreBtn"
          title="المزيد">
          ⋮
        </button>

      </div>

    </header>


    <!-- ==========================
         ROOM POPUP
    =========================== -->

    <div
      class="room-info"
      id="roomInfo">

      <div class="room-info-title">
        🔐 غرفة المحادثة
      </div>

      <div
        class="room-link"
        id="roomLink">
      </div>

      <button
        class="copy-room"
        id="copyRoom">
        📋 نسخ رابط الغرفة
      </button>

    </div>


    <!-- ==========================
         MESSAGES
    =========================== -->

    <section
      class="messages"
      id="messages">

      <div
        class="welcome"
        id="welcome">

        <div class="welcome-icon">
          💬
        </div>

        <div class="welcome-title">
          محادثة خاصة
        </div>

        <div class="welcome-text">
          شارك رابط هذه الغرفة مع شخص آخر
          لبدء محادثة مباشرة وآمنة.
        </div>

      </div>

    </section>


    <!-- ==========================
         TYPING
    =========================== -->

    <div
      class="typing hidden"
      id="typing">
      يكتب الآن...
    </div>


    <!-- ==========================
         FOOTER
    =========================== -->

    <form
      class="footer"
      id="chatForm">


      <button
        type="button"
        class="emoji-btn"
        id="emojiBtn">
        😊
      </button>


      <div class="input-wrap">

        <input
          id="messageInput"
          type="text"
          autocomplete="off"
          placeholder="اكتب رسالة...">

      </div>


      <button
        type="submit"
        class="send-btn"
        title="إرسال">
        ➤
      </button>

    </form>


    <!-- ==========================
         EMOJI PICKER
    =========================== -->

    <div
      class="emoji-picker"
      id="emojiPicker">

      <button class="emoji-item">😀</button>
      <button class="emoji-item">😂</button>
      <button class="emoji-item">🤣</button>
      <button class="emoji-item">😊</button>
      <button class="emoji-item">😍</button>
      <button class="emoji-item">🥰</button>
      <button class="emoji-item">😘</button>
      <button class="emoji-item">😎</button>

      <button class="emoji-item">❤️</button>
      <button class="emoji-item">🧡</button>
      <button class="emoji-item">💛</button>
      <button class="emoji-item">💚</button>
      <button class="emoji-item">💙</button>
      <button class="emoji-item">💜</button>
      <button class="emoji-item">🖤</button>
      <button class="emoji-item">🤍</button>

      <button class="emoji-item">👍</button>
      <button class="emoji-item">👎</button>
      <button class="emoji-item">👏</button>
      <button class="emoji-item">🙏</button>
      <button class="emoji-item">🔥</button>
      <button class="emoji-item">🎉</button>
      <button class="emoji-item">💯</button>
      <button class="emoji-item">✨</button>

      <button class="emoji-item">😂</button>
      <button class="emoji-item">😭</button>
      <button class="emoji-item">😡</button>
      <button class="emoji-item">🤔</button>
      <button class="emoji-item">😴</button>
      <button class="emoji-item">🤩</button>
      <button class="emoji-item">😇</button>
      <button class="emoji-item">🥳</button>

    </div>

  </main>

</div>


<!--
=================================================
مهم:
نظام الغرفة لا يزال موجودًا في script.js
=================================================
-->

<script src="script.js"></script>


<script>

  /* =========================================
     وظائف الواجهة
  ========================================= */


  const messageInput =
    document.getElementById('messageInput');


  const messages =
    document.getElementById('messages');


  const emojiBtn =
    document.getElementById('emojiBtn');


  const emojiPicker =
    document.getElementById('emojiPicker');


  const roomBtn =
    document.getElementById('roomBtn');


  const roomInfo =
    document.getElementById('roomInfo');


  const copyRoom =
    document.getElementById('copyRoom');


  const roomLink =
    document.getElementById('roomLink');


  const themeBtn =
    document.getElementById('themeBtn');


  const welcome =
    document.getElementById('welcome');


  /* =========================================
     رابط الغرفة
  ========================================= */

  roomLink.innerText =
    location.href;


  roomBtn.addEventListener(
    'click',
    event => {

      event.stopPropagation();

      roomInfo.classList.toggle(
        'show'
      );

    }
  );


  copyRoom.addEventListener(
    'click',
    async () => {

      try {

        await navigator.clipboard.writeText(
          location.href
        );

        copyRoom.innerText =
          '✅ تم نسخ الرابط';

        setTimeout(() => {

          copyRoom.innerText =
            '📋 نسخ رابط الغرفة';

        }, 1500);

      }

      catch {

        alert(
          'انسخ الرابط من أعلى المتصفح'
        );

      }

    }
  );


  /* =========================================
     إغلاق popup
  ========================================= */

  document.addEventListener(
    'click',
    event => {

      if (
        !roomInfo.contains(event.target) &&
        event.target !== roomBtn
      ) {

        roomInfo.classList.remove(
          'show'
        );

      }

      if (
        !emojiPicker.contains(event.target) &&
        event.target !== emojiBtn
      ) {

        emojiPicker.classList.remove(
          'show'
        );

      }

    }
  );


  /* =========================================
     Emoji
  ========================================= */

  emojiBtn.addEventListener(
    'click',
    event => {

      event.stopPropagation();

      emojiPicker.classList.toggle(
        'show'
      );

    }
  );


  document
    .querySelectorAll('.emoji-item')
    .forEach(button => {

      button.addEventListener(
        'click',
        () => {

          messageInput.value +=
            button.innerText;

          messageInput.focus();

          emojiPicker.classList.remove(
            'show'
          );

        }
      );

    });


  /* =========================================
     Dark mode
  ========================================= */

  const savedTheme =
    localStorage.getItem(
      'chat_theme'
    );


  if (savedTheme === 'dark') {

    document.body.classList.add(
      'dark'
    );

    themeBtn.innerText = '☀️';
  }


  themeBtn.addEventListener(
    'click',
    () => {

      document.body.classList.toggle(
        'dark'
      );


      const dark =
        document.body.classList.contains(
          'dark'
        );


      localStorage.setItem(
        'chat_theme',
        dark ? 'dark' : 'light'
      );


      themeBtn.innerText =
        dark ? '☀️' : '🌙';

    }
  );


  /* =========================================
     إخفاء رسالة الترحيب عند أول رسالة
  ========================================= */

  window.hideWelcome =
    function() {

      if (welcome) {

        welcome.style.display =
          'none';

      }

    };


  /* =========================================
     Scroll
  ========================================= */

  window.scrollChatToBottom =
    function() {

      messages.scrollTop =
        messages.scrollHeight;

    };


  /* =========================================
     الكيبورد
  ========================================= */

  messageInput.addEventListener(
    'focus',
    () => {

      setTimeout(
        scrollChatToBottom,
        150
      );

    }
  );


  if (window.visualViewport) {

    window.visualViewport.addEventListener(
      'resize',
      () => {

        setTimeout(
          scrollChatToBottom,
          100
        );

      }
    );

  }

</script>

</body>
</html>
