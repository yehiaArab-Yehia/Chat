<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script src="https://cdn.scaledrone.com/scaledrone.min.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>WhatsApp Chat</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: #d1d7db;
      overflow: hidden;
    }

    .content {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #efeae2;
      overflow: hidden;
    }

    /* ====== الهيدر ====== */
    .chat-header {
      height: 62px;
      min-height: 62px;
      background: #075e54;
      color: white;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }
    .chat-header__back { font-size: 23px; cursor: pointer; }
    .chat-header__avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #128c7e;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }
    .chat-header__info {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-width: 0;
    }
    .chat-header__title {
      font-size: 16px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .chat-header__status {
      font-size: 12px;
      color: #cfe9e4;
      margin-top: 2px;
    }
    .chat-header__actions {
      display: flex;
      gap: 18px;
      font-size: 19px;
    }

    /* ====== الرسائل ====== */
    .messages {
      flex: 1;
      min-height: 0;
      width: 100%;
      padding: 14px 10px 10px;
      overflow-y: auto;
      overflow-x: hidden;
      background-color: #efeae2;
      background-image: radial-gradient(rgba(0,0,0,0.035) 1px, transparent 1px);
      background-size: 22px 22px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      display: flex;
      flex-direction: column;
      margin-bottom: 6px;
      max-width: 78%;
      animation: messageIn .15s ease-out;
    }
    @keyframes messageIn {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message--theirs { align-items: flex-start; margin-right: auto; }
    .message--mine   { align-items: flex-end;   margin-left: auto; }

    .message__name {
      font-size: 11px;
      color: #667781;
      padding: 2px 8px;
      font-weight: 600;
    }

    .message__bubble {
      padding: 8px 12px 7px;
      border-radius: 8px;
      position: relative;
      word-break: break-word;
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.4;
      box-shadow: 0 1px .5px rgba(0,0,0,.13);
      color: #111b21;
      max-width: 100%;
    }
    .message--theirs .message__bubble {
      background: white;
      border-top-left-radius: 2px;
    }
    .message--mine .message__bubble {
      background: #d9fdd3;
      border-top-right-radius: 2px;
    }

    .message__time {
      font-size: 10px;
      color: #667781;
      margin-top: 2px;
      padding: 0 4px;
      align-self: flex-end;
    }

    /* ====== رسائل النظام ====== */
    .system-message {
      text-align: center;
      font-size: 12px;
      color: #54656f;
      background: rgba(255,255,255,.85);
      padding: 6px 12px;
      border-radius: 8px;
      margin: 8px auto;
      max-width: 85%;
      box-shadow: 0 1px .5px rgba(0,0,0,.1);
    }

    /* ====== الفوتر ====== */
    .footer {
      width: 100%;
      min-height: 62px;
      padding: 8px 8px;
      display: flex;
      align-items: center;
      gap: 7px;
      background: #f0f2f5;
      border-top: 1px solid #e1e5e9;
      flex-shrink: 0;
      z-index: 20;
    }

    .footer__input-wrap {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      background: white;
      border-radius: 22px;
      padding: 5px 14px;
    }

    input[type="text"] {
      width: 100%;
      border: none;
      outline: none;
      padding: 7px 3px;
      font-size: 15px;
      background: transparent;
      font-family: inherit;
      color: #111b21;
    }
    input[type="text"]::placeholder { color: #8696a0; }

    .send-btn {
      width: 46px;
      height: 46px;
      min-width: 46px;
      border: none;
      border-radius: 50%;
      background: #00a884;
      color: white;
      font-size: 19px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform .1s, background .15s;
    }
    .send-btn:hover { background: #017561; }
    .send-btn:active { transform: scale(.92); }

    @media (max-width: 480px) {
      body { background: #efeae2; }
      .content {
        width: 100vw;
        height: 100dvh;
        max-width: none;
        max-height: none;
        box-shadow: none;
      }
      .chat-header { height: 60px; min-height: 60px; }
      .messages { padding: 10px 8px; }
      .message { max-width: 84%; }
      .footer { min-height: 60px; padding: 7px; }
    }
  </style>
</head>
<body>
  <div class="content">

    <div class="chat-header">
      <div class="chat-header__back">←</div>
      <div class="chat-header__avatar">💬</div>
      <div class="chat-header__info">
        <div class="chat-header__title">محادثة</div>
        <div class="chat-header__status">في انتظار الاتصال...</div>
      </div>
      <div class="chat-header__actions">
        <span>📞</span>
        <span>⋮</span>
      </div>
    </div>

    <div class="messages"></div>

    <form class="footer" onsubmit="return false;">
      <div class="footer__input-wrap">
        <input type="text" placeholder="اكتب رسالة...">
      </div>
      <button type="submit" class="send-btn" title="إرسال">➤</button>
    </form>

  </div>

  <template data-template="message">
    <div class="message">
      <div class="message__name"></div>
      <div class="message__bubble"></div>
      <div class="message__time"></div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
